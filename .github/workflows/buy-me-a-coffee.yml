name: Liste des donateurs BuyMeACoffee

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  bmac-readme:
    name: Update Buy Me A Coffee section in this repo's README
    runs-on: ubuntu-latest
    steps:
      - uses: akosbalasko/coffee-readme@021a2db498f0682fe902eca059c04cc800825c0a # v1.0.4
        with:
          BUY_ME_A_COFFEE_TOKEN: ${{ secrets.BMC_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER_OF_MESSAGES: 5

      - name: Anonymize donor names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/contents/README.md -H "Accept: application/vnd.github+json" > /tmp/readme.json

          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess

          data = json.load(open("/tmp/readme.json"))
          content = base64.b64decode(data["content"]).decode("utf-8")

          start = content.find("<!--START_SECTION:buy-me-a-coffee-->")
          end = content.find("<!--END_SECTION:buy-me-a-coffee-->")
          if start == -1 or end == -1:
              raise SystemExit("Buy Me A Coffee section not found")

          section_end = end + len("<!--END_SECTION:buy-me-a-coffee-->")
          section = content[start:section_end]

          def anonymize(match):
              full_name = match.group(1).strip()
              parts = full_name.split()
              if len(parts) < 2:
                  return match.group(0)
              return f"from <b>{parts[0]} {parts[1][0]}*****</b>"

          anonymized = re.sub(r"from <b>([^<]+)</b>", anonymize, section)

          if anonymized == section:
              raise SystemExit(0)

          updated = content[:start] + anonymized + content[section_end:]

          payload = json.dumps({
              "message": "chore: anonymize donor names",
              "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
              "sha": data["sha"],
              "branch": "main"
          })

          subprocess.run(
              ["gh", "api", "repos/${{ github.repository }}/contents/README.md",
               "-X", "PUT",
               "-H", "Accept: application/vnd.github+json",
               "--input", "-"],
              input=payload.encode(),
              check=True
          )
          PY
